# Linux Kernel Hardening & Performance Optimization for Proxmox VE
# Deployment target: /etc/sysctl.d/99-homelab-hardening.conf

# 1. Network Protection & Anti-Spoofing Filters
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1

# 2. High-Concurrency Network Connection Performance
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_fin_timeout = 15

# 3. Virtual Memory Governance & OOM Killer Thrashing Prevention
vm.swappiness = 10
vm.vfs_cache_pressure = 50
fs.inotify.max_user_watches = 524288
