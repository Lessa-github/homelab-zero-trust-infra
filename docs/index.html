<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zero-Trust Homelab | High-Density Infrastructure</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Technical engineering documentation of Gabriel Lessa's Proxmox VE Zero-Trust Infrastructure.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-color: #06b6d4;
      --text-color-base: #e2e8f0;
      --bg-color: #0b0f19;
      --sidebar-bg: #070a12;
      --sidebar-text: #94a3b8;
    }
    html {
      scroll-behavior: auto !important;
    }
    body {
      background-color: #0b0f19 !important;
      color: #e2e8f0 !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }
    .sidebar {
      background-color: #060911 !important;
      border-right: 1px solid #1e293b !important;
      width: 330px !important;
    }
    .sidebar-nav {
      padding: 10px 0 30px 15px !important;
    }
    .sidebar hr {
      border: none !important;
      height: 1px !important;
      background: #1e293b !important;
      margin: 20px 25px 20px 10px !important;
    }
    .sidebar-nav a {
      color: #94a3b8 !important;
      font-size: 0.95rem !important;
      transition: all 0.2s ease !important;
      border-left: 2px solid transparent !important;
      padding-left: 8px !important;
      padding-right: 15px !important;
      display: block !important;
      white-space: normal !important;
      word-break: break-word !important;
      text-overflow: unset !important;
      overflow: visible !important;
      line-height: 1.4 !important;
    }
    .sidebar-nav a:hover {
      color: #38bdf8 !important;
      border-left-color: #38bdf8 !important;
      padding-left: 12px !important;
    }
    .sidebar-nav li.active > a {
      color: #00f0ff !important;
      font-weight: 600 !important;
      border-left-color: #00f0ff !important;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3) !important;
    }
    .app-name-link {
      font-weight: 700;
      color: #38bdf8 !important;
      font-size: 1.15rem;
    }
    /* Expanded Fluid Widescreen Layout */
    .content {
      left: 330px !important;
      padding-top: 20px !important;
      max-width: calc(100% - 330px) !important;
    }
    @media screen and (max-width: 768px) {
      .sidebar {
        width: 300px !important;
      }
      .content {
        left: 0 !important;
        max-width: 100% !important;
      }
    }
    .markdown-section {
      max-width: 95% !important;
      margin: 0 auto !important;
      padding: 30px 35px 80px 35px !important;
      font-size: 1rem !important;
      line-height: 1.7 !important;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace !important;
    }
    pre {
      background-color: #070a13 !important;
      border: 1px solid #1e293b !important;
      border-left: 3px solid #00f0ff !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
      font-size: 0.95rem !important;
    }
    code {
      color: #38bdf8 !important;
      background-color: rgba(56, 189, 248, 0.1) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-size: 0.92rem !important;
    }
    pre code {
      color: #e2e8f0 !important;
      background-color: transparent !important;
      padding: 0 !important;
    }
    .markdown-section blockquote {
      border-left: 4px solid #06b6d4;
      background: rgba(6, 182, 212, 0.05);
      color: #cbd5e1;
      border-radius: 0 8px 8px 0;
      padding: 12px 20px;
      font-size: 1rem !important;
    }
    .markdown-section h1 { 
      color: #38bdf8; 
      letter-spacing: -0.02em !important;
      border-bottom: 2px solid #1e293b !important;
      padding-bottom: 12px !important;
    }
    .markdown-section h2 { 
      color: #00f0ff; 
      border-bottom: 1px solid #1e293b; 
      padding-bottom: 8px; 
      margin-top: 3rem;
    }
    .markdown-section h3 { color: #10b981; margin-top: 2rem; }
    
    /* High-Contrast Spacious Dark Hacker Table */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 24px 0 !important;
      background-color: #0d1322 !important;
      border: 1px solid #1e293b !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }
    .markdown-section table tr {
      background-color: #0b0f19 !important;
      border-top: 1px solid #1e293b !important;
      border-bottom: 1px solid #1e293b !important;
      transition: background-color 0.15s ease !important;
    }
    .markdown-section table tr:nth-child(2n) {
      background-color: #131b2e !important;
    }
    .markdown-section table tr:hover {
      background-color: #1e293b !important;
    }
    .markdown-section table th {
      background-color: #161e2e !important;
      color: #38bdf8 !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      border: 1px solid #334155 !important;
      padding: 12px 16px !important;
      text-align: left !important;
    }
    .markdown-section table td {
      color: #f8fafc !important;
      border: 1px solid #1e293b !important;
      padding: 12px 16px !important;
      font-size: 0.95rem !important;
    }
    .markdown-section table td code {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-size: 0.9rem !important;
    }

    /* Mermaid Diagram Sizing & Centering: Crisp, Responsive & Expandable */
    .mermaid {
      position: relative !important;
      text-align: center !important;
      margin: 2.2rem auto !important;
      overflow-x: auto !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      cursor: zoom-in !important;
      border-radius: 8px !important;
      padding: 14px 10px !important;
      background: rgba(13, 19, 34, 0.5) !important;
      border: 1px solid rgba(30, 41, 59, 0.6) !important;
      transition: all 0.2s ease !important;
    }
    .mermaid:hover {
      background: rgba(15, 23, 42, 0.8) !important;
      border-color: rgba(56, 189, 248, 0.4) !important;
    }
    .mermaid svg {
      max-width: 100% !important;
      width: auto !important;
      height: auto !important;
      margin: 0 auto !important;
      display: block !important;
    }
    .mermaid-zoom-badge {
      position: absolute;
      top: 10px;
      right: 14px;
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
      z-index: 10;
      user-select: none;
    }
    .mermaid:hover .mermaid-zoom-badge {
      opacity: 1;
      background: #1e293b;
      border-color: #38bdf8;
    }
    .mermaid.mermaid-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(5, 8, 16, 0.96) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      z-index: 999999 !important;
      margin: 0 !important;
      padding: 50px 30px !important;
      box-sizing: border-box !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      cursor: zoom-out !important;
      overflow: auto !important;
    }
    .mermaid.mermaid-fullscreen svg {
      max-width: 94vw !important;
      max-height: 86vh !important;
      width: auto !important;
      height: auto !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8) !important;
    }
    .mermaid.mermaid-fullscreen .mermaid-zoom-badge {
      position: fixed;
      top: 20px;
      right: 25px;
      background: #ef4444;
      color: #ffffff;
      border: 1px solid #f87171;
      font-size: 0.82rem;
      padding: 6px 14px;
      opacity: 1;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }

    /* Mermaid Global High-Contrast SVG Typography & Timeline Text Colors */
    .mermaid svg text,
    .mermaid svg text *,
    .mermaid svg tspan,
    .mermaid svg text.actor,
    .mermaid svg text.taskText,
    .mermaid svg text.sectionTitle,
    .mermaid svg g.timeline-node text {
      fill: #f8fafc !important;
      color: #f8fafc !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-weight: 500 !important;
    }
    .mermaid svg text.timeline-axis-label {
      fill: #38bdf8 !important;
      font-weight: 600 !important;
    }
    .mermaid svg text.sectionTitle {
      fill: #00f0ff !important;
      font-weight: 700 !important;
    }
    .mermaid svg text.timeline-title {
      fill: #38bdf8 !important;
      font-size: 1.15rem !important;
      font-weight: 700 !important;
      text-anchor: middle !important;
    }

    /* Sequence Diagram Participant Boxes Hardening */
    .mermaid svg rect.actor {
      fill: #161e2e !important;
      stroke: #38bdf8 !important;
      stroke-width: 1.5px !important;
    }
    .mermaid svg line.actor-line {
      stroke: #334155 !important;
    }
    .mermaid svg text.actor {
      fill: #f8fafc !important;
      font-weight: 600 !important;
    }
    .mermaid svg .messageText {
      fill: #e2e8f0 !important;
      font-size: 0.88rem !important;
    }
    .mermaid svg .noteText {
      fill: #f8fafc !important;
    }
    .mermaid svg rect.note {
      fill: #0f172a !important;
      stroke: #10b981 !important;
    }
  </style>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#070a13',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#38bdf8',
        secondaryColor: '#0f172a',
        tertiaryColor: '#111827',
        textColor: '#f8fafc',
        mainBkg: '#0d1322',
        nodeBorder: '#38bdf8',
        clusterBkg: '#090e1a',
        clusterBorder: '#1e293b',
        defaultLinkColor: '#38bdf8',
        titleColor: '#00f0ff',
        edgeLabelBackground: '#0b0f19',
        actorTextColor: '#f8fafc',
        actorBkg: '#1e293b',
        actorBorder: '#38bdf8',
        signalColor: '#f8fafc',
        signalTextColor: '#f8fafc',
        labelTextColor: '#f8fafc',
        fontFamily: 'Inter, sans-serif'
      }
    });
  </script>
</head>
<body>
  <div id="app">Loading technical documentation...</div>
  <script>
    window.$docsify = {
      name: '🏛️ Zero-Trust Homelab',
      repo: 'https://github.com/Lessa-github/homelab-zero-trust-infra',
      requestHeaders: {
        'cache-control': 'max-age=0, no-cache'
      },
      loadSidebar: '_sidebar.md?t=' + Date.now(),
      loadNavbar: '_navbar.md?t=' + Date.now(),
      subMaxLevel: 0,
      search: {
        placeholder: 'Search topics & architectures...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return ('<div class="mermaid">' + code + "</div>");
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            function attachZoom() {
              document.querySelectorAll('.mermaid').forEach(function(el) {
                if (!el.querySelector('.mermaid-zoom-badge')) {
                  var badge = document.createElement('span');
                  badge.className = 'mermaid-zoom-badge';
                  badge.innerHTML = '🔍 Click to expand ⛶';
                  el.appendChild(badge);

                  el.addEventListener('click', function(e) {
                    if (el.classList.contains('mermaid-fullscreen')) {
                      if (e.target === el || e.target.classList.contains('mermaid-zoom-badge') || !e.target.closest('svg')) {
                        el.classList.remove('mermaid-fullscreen');
                        badge.innerHTML = '🔍 Click to expand ⛶';
                        document.body.style.overflow = '';
                      }
                    } else {
                      el.classList.add('mermaid-fullscreen');
                      badge.innerHTML = '✕ Close Fullscreen (Esc)';
                      document.body.style.overflow = 'hidden';
                    }
                  });
                }
              });
            }

            try {
              var p = mermaid.run();
              if (p && typeof p.then === 'function') {
                p.then(attachZoom);
              } else {
                setTimeout(attachZoom, 250);
              }
            } catch(e) {
              setTimeout(attachZoom, 250);
            }
          });
        }
      ]
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        var active = document.querySelector('.mermaid.mermaid-fullscreen');
        if (active) {
          active.classList.remove('mermaid-fullscreen');
          var badge = active.querySelector('.mermaid-zoom-badge');
          if (badge) badge.innerHTML = '🔍 Click to expand ⛶';
          document.body.style.overflow = '';
        }
      }
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
