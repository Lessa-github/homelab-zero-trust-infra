<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zero-Trust Homelab | High-Density Infrastructure</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Technical engineering documentation of Gabriel Lessa's Proxmox VE Zero-Trust Infrastructure.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-color: #06b6d4;
      --text-color-base: #e2e8f0;
      --bg-color: #0b0f19;
      --sidebar-bg: #070a12;
      --sidebar-text: #94a3b8;
    }
    html {
      scroll-behavior: auto !important;
    }
    body {
      background-color: #0b0f19 !important;
      color: #e2e8f0 !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }
    .sidebar {
      background-color: #060911 !important;
      border-right: 1px solid #1e293b !important;
      width: 330px !important;
    }
    .sidebar-nav {
      padding: 10px 0 30px 15px !important;
    }
    .sidebar hr {
      border: none !important;
      height: 1px !important;
      background: #1e293b !important;
      margin: 20px 25px 20px 10px !important;
    }
    .sidebar-nav a {
      color: #94a3b8 !important;
      font-size: 0.95rem !important;
      transition: all 0.2s ease !important;
      border-left: 2px solid transparent !important;
      padding-left: 8px !important;
      padding-right: 15px !important;
      display: block !important;
      white-space: normal !important;
      word-break: break-word !important;
      text-overflow: unset !important;
      overflow: visible !important;
      line-height: 1.4 !important;
    }
    .sidebar-nav a:hover {
      color: #38bdf8 !important;
      border-left-color: #38bdf8 !important;
      padding-left: 12px !important;
    }
    .sidebar-nav li.active > a {
      color: #00f0ff !important;
      font-weight: 600 !important;
      border-left-color: #00f0ff !important;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3) !important;
    }
    .app-name-link {
      font-weight: 700;
      color: #38bdf8 !important;
      font-size: 1.15rem;
    }
    /* Expanded Fluid Widescreen Layout */
    .content {
      left: 330px !important;
      padding-top: 20px !important;
      max-width: calc(100% - 330px) !important;
    }
    @media screen and (max-width: 768px) {
      .sidebar {
        width: 300px !important;
      }
      .content {
        left: 0 !important;
        max-width: 100% !important;
      }
    }
    .markdown-section {
      max-width: 95% !important;
      margin: 0 auto !important;
      padding: 30px 35px 80px 35px !important;
      font-size: 1rem !important;
      line-height: 1.7 !important;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace !important;
    }
    pre {
      background-color: #070a13 !important;
      border: 1px solid #1e293b !important;
      border-left: 3px solid #00f0ff !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
      font-size: 0.95rem !important;
    }
    code {
      color: #38bdf8 !important;
      background-color: rgba(56, 189, 248, 0.1) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-size: 0.92rem !important;
    }
    pre code {
      color: #e2e8f0 !important;
      background-color: transparent !important;
      padding: 0 !important;
    }
    .markdown-section blockquote {
      border-left: 4px solid #06b6d4;
      background: rgba(6, 182, 212, 0.05);
      color: #cbd5e1;
      border-radius: 0 8px 8px 0;
      padding: 12px 20px;
      font-size: 1rem !important;
    }
    .markdown-section h1 { 
      color: #38bdf8; 
      letter-spacing: -0.02em !important;
      border-bottom: 2px solid #1e293b !important;
      padding-bottom: 12px !important;
    }
    .markdown-section h2 { 
      color: #00f0ff; 
      border-bottom: 1px solid #1e293b; 
      padding-bottom: 8px; 
      margin-top: 3rem;
    }
    .markdown-section h3 { color: #10b981; margin-top: 2rem; }
    
    /* High-Contrast Spacious Dark Hacker Table */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 24px 0 !important;
      background-color: #0d1322 !important;
      border: 1px solid #1e293b !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }
    .markdown-section table tr {
      background-color: #0b0f19 !important;
      border-top: 1px solid #1e293b !important;
      border-bottom: 1px solid #1e293b !important;
      transition: background-color 0.15s ease !important;
    }
    .markdown-section table tr:nth-child(2n) {
      background-color: #131b2e !important;
    }
    .markdown-section table tr:hover {
      background-color: #1e293b !important;
    }
    .markdown-section table th {
      background-color: #161e2e !important;
      color: #38bdf8 !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      border: 1px solid #334155 !important;
      padding: 12px 16px !important;
      text-align: left !important;
    }
    .markdown-section table td {
      color: #f8fafc !important;
      border: 1px solid #1e293b !important;
      padding: 12px 16px !important;
      font-size: 0.95rem !important;
    }
    .markdown-section table td code {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-size: 0.9rem !important;
    }

    /* Mermaid Diagram Sizing & Centering: Crisp, Responsive & Expandable */
    .mermaid {
      position: relative !important;
      text-align: center !important;
      margin: 2.2rem auto !important;
      overflow-x: auto !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      cursor: zoom-in !important;
      border-radius: 8px !important;
      padding: 14px 10px !important;
      background: rgba(13, 19, 34, 0.5) !important;
      border: 1px solid rgba(30, 41, 59, 0.6) !important;
      transition: all 0.2s ease !important;
    }
    .mermaid:hover {
      background: rgba(15, 23, 42, 0.8) !important;
      border-color: rgba(56, 189, 248, 0.4) !important;
    }
    .mermaid svg {
      max-width: 100% !important;
      width: auto !important;
      height: auto !important;
      margin: 0 auto !important;
      display: block !important;
    }
    .mermaid-zoom-badge {
      position: absolute;
      top: 10px;
      right: 14px;
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
      z-index: 10;
      user-select: none;
    }
    .mermaid:hover .mermaid-zoom-badge {
      opacity: 1;
      background: #1e293b;
      border-color: #38bdf8;
    }
    .mermaid.mermaid-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(5, 8, 16, 0.96) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      z-index: 999999 !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      overflow: hidden !important;
      user-select: none !important;
      cursor: grab !important;
    }
    .mermaid.mermaid-fullscreen.is-dragging {
      cursor: grabbing !important;
    }
    .mermaid.mermaid-fullscreen svg {
      max-width: 90vw !important;
      max-height: 82vh !important;
      width: auto !important;
      height: auto !important;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8) !important;
      transform-origin: center center !important;
      will-change: transform !important;
      pointer-events: auto !important;
    }
    .mermaid.mermaid-fullscreen .mermaid-zoom-badge {
      display: none !important;
    }
    .mermaid-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 40px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000000;
      color: #f8fafc;
      font-size: 0.82rem;
      pointer-events: auto;
    }
    .mermaid-dock button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mermaid-dock button:hover {
      background: #38bdf8;
      color: #0b0f19;
      border-color: #38bdf8;
    }
    .mermaid-dock .btn-close {
      background: #dc2626;
      border-color: #ef4444;
      color: #ffffff;
    }
    .mermaid-dock .btn-close:hover {
      background: #b91c1c;
      border-color: #dc2626;
      color: #ffffff;
    }
    .mermaid-dock .dock-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 4px;
    }
    .mermaid-dock .dock-hint {
      color: #94a3b8;
      font-size: 0.78rem;
      margin: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Anti-Clipping Rule: Ensure SVG foreignObject labels never eat letters or words */
    .mermaid svg foreignObject {
      overflow: visible !important;
    }
    .mermaid svg foreignObject > div {
      overflow: visible !important;
      width: auto !important;
      min-width: 100% !important;
      white-space: nowrap !important;
    }
    .mermaid svg foreignObject p {
      margin: 0 !important;
      padding: 0 4px !important;
      white-space: nowrap !important;
    }
    .mermaid svg .cluster foreignObject {
      overflow: visible !important;
    }
    .mermaid svg .cluster foreignObject div {
      overflow: visible !important;
      white-space: nowrap !important;
    }

    /* Mermaid Global High-Contrast SVG Typography & Timeline Text Colors */
    .mermaid svg text,
    .mermaid svg text *,
    .mermaid svg tspan,
    .mermaid svg text.actor,
    .mermaid svg text.taskText,
    .mermaid svg text.sectionTitle,
    .mermaid svg g.timeline-node text {
      fill: #f8fafc !important;
      color: #f8fafc !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-weight: 500 !important;
    }
    .mermaid svg text.timeline-axis-label {
      fill: #38bdf8 !important;
      font-weight: 600 !important;
    }
    .mermaid svg text.sectionTitle {
      fill: #00f0ff !important;
      font-weight: 700 !important;
    }
    .mermaid svg text.timeline-title {
      fill: #38bdf8 !important;
      font-size: 1.15rem !important;
      font-weight: 700 !important;
      text-anchor: middle !important;
    }

    /* Sequence Diagram Participant Boxes Hardening */
    .mermaid svg rect.actor {
      fill: #161e2e !important;
      stroke: #38bdf8 !important;
      stroke-width: 1.5px !important;
    }
    .mermaid svg line.actor-line {
      stroke: #334155 !important;
    }
    .mermaid svg text.actor {
      fill: #f8fafc !important;
      font-weight: 600 !important;
    }
    .mermaid svg .messageText {
      fill: #e2e8f0 !important;
      font-size: 0.88rem !important;
    }
    .mermaid svg .noteText {
      fill: #f8fafc !important;
    }
    .mermaid svg rect.note {
      fill: #0f172a !important;
      stroke: #10b981 !important;
    }
  </style>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#070a13',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#38bdf8',
        secondaryColor: '#0f172a',
        tertiaryColor: '#111827',
        textColor: '#f8fafc',
        mainBkg: '#0d1322',
        nodeBorder: '#38bdf8',
        clusterBkg: '#090e1a',
        clusterBorder: '#1e293b',
        defaultLinkColor: '#38bdf8',
        titleColor: '#00f0ff',
        edgeLabelBackground: '#0b0f19',
        actorTextColor: '#f8fafc',
        actorBkg: '#1e293b',
        actorBorder: '#38bdf8',
        signalColor: '#f8fafc',
        signalTextColor: '#f8fafc',
        labelTextColor: '#f8fafc',
        fontFamily: 'Inter, sans-serif'
      }
    });
  </script>

<body>
  <div id="app">Loading technical documentation...</div>
  <script>
    window.$docsify = {
      name: '🏛️ Zero-Trust Homelab',
      repo: 'https://github.com/Lessa-github/homelab-zero-trust-infra',
      requestHeaders: {
        'cache-control': 'max-age=0, no-cache'
      },
      loadSidebar: '_sidebar.md?t=' + Date.now(),
      loadNavbar: '_navbar.md?t=' + Date.now(),
      subMaxLevel: 0,
      search: {
        placeholder: 'Search topics & architectures...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return ('<div class="mermaid">' + code + "</div>");
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            function initMermaidPanZoom(container) {
              if (container.dataset.panzoomBound) return;
              container.dataset.panzoomBound = 'true';

              var svg = container.querySelector('svg');
              if (!svg) return;

              var badge = document.createElement('span');
              badge.className = 'mermaid-zoom-badge';
              badge.innerHTML = '🔍 Click to expand ⛶';
              container.appendChild(badge);

              var scale = 1;
              var panX = 0;
              var panY = 0;
              var isPanning = false;
              var startX = 0;
              var startY = 0;
              var hasMoved = false;
              var dock = null;

              function applyTransform(withTransition) {
                svg.style.transition = withTransition ? 'transform 0.2s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
                svg.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
                if (dock) {
                  var scaleBtn = dock.querySelector('.btn-scale');
                  if (scaleBtn) scaleBtn.textContent = Math.round(scale * 100) + '%';
                }
              }

              function closeFullscreen() {
                container.classList.remove('mermaid-fullscreen');
                container.classList.remove('is-dragging');
                document.body.style.overflow = '';
                scale = 1;
                panX = 0;
                panY = 0;
                svg.style.transform = '';
                svg.style.transition = '';
                if (dock) {
                  dock.remove();
                  dock = null;
                }
              }

              function openFullscreen() {
                container.classList.add('mermaid-fullscreen');
                document.body.style.overflow = 'hidden';
                scale = 1;
                panX = 0;
                panY = 0;
                applyTransform(false);

                if (!dock) {
                  dock = document.createElement('div');
                  dock.className = 'mermaid-dock';
                  dock.innerHTML = [
                    '<button class="btn-zoom-in" title="Zoom In (+)">➕</button>',
                    '<button class="btn-scale" title="Reset Zoom (100%)">100%</button>',
                    '<button class="btn-zoom-out" title="Zoom Out (-)">➖</button>',
                    '<div class="dock-divider"></div>',
                    '<span class="dock-hint">🖱️ Scroll to zoom · 🖐️ Drag to pan</span>',
                    '<div class="dock-divider"></div>',
                    '<button class="btn-close" title="Close (Esc)">✕ Close</button>'
                  ].join('');
                  container.appendChild(dock);

                  dock.querySelector('.btn-zoom-in').addEventListener('click', function(e) {
                    e.stopPropagation();
                    scale = Math.min(scale * 1.25, 5.0);
                    applyTransform(true);
                  });

                  dock.querySelector('.btn-zoom-out').addEventListener('click', function(e) {
                    e.stopPropagation();
                    scale = Math.max(scale / 1.25, 0.35);
                    applyTransform(true);
                  });

                  dock.querySelector('.btn-scale').addEventListener('click', function(e) {
                    e.stopPropagation();
                    scale = 1;
                    panX = 0;
                    panY = 0;
                    applyTransform(true);
                  });

                  dock.querySelector('.btn-close').addEventListener('click', function(e) {
                    e.stopPropagation();
                    closeFullscreen();
                  });
                }
              }

              container.addEventListener('click', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) {
                  openFullscreen();
                }
              });

              container.addEventListener('wheel', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                e.preventDefault();
                var cx = window.innerWidth / 2;
                var cy = window.innerHeight / 2;
                var mouseX = e.clientX;
                var mouseY = e.clientY;

                var svgCenterX = cx + panX;
                var svgCenterY = cy + panY;
                var relX = (mouseX - svgCenterX) / scale;
                var relY = (mouseY - svgCenterY) / scale;

                var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                var newScale = Math.min(Math.max(scale * factor, 0.35), 6.0);

                panX = mouseX - cx - relX * newScale;
                panY = mouseY - cy - relY * newScale;
                scale = newScale;

                applyTransform(false);
              }, { passive: false });

              container.addEventListener('mousedown', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.target.closest('.mermaid-dock')) return;
                if (e.button === 0) {
                  isPanning = true;
                  hasMoved = false;
                  startX = e.clientX - panX;
                  startY = e.clientY - panY;
                  container.classList.add('is-dragging');
                }
              });

              window.addEventListener('mousemove', function(e) {
                if (!isPanning || !container.classList.contains('mermaid-fullscreen')) return;
                var dx = Math.abs(e.clientX - (startX + panX));
                var dy = Math.abs(e.clientY - (startY + panY));
                if (dx > 4 || dy > 4) hasMoved = true;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                applyTransform(false);
              });

              window.addEventListener('mouseup', function(e) {
                if (!isPanning || !container.classList.contains('mermaid-fullscreen')) return;
                isPanning = false;
                container.classList.remove('is-dragging');
                if (!hasMoved && (e.target === container || !e.target.closest('svg'))) {
                  closeFullscreen();
                }
              });

              var initialPinchDist = 0;
              var initialPinchScale = 1;

              container.addEventListener('touchstart', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.target.closest('.mermaid-dock')) return;
                if (e.touches.length === 1) {
                  isPanning = true;
                  hasMoved = false;
                  startX = e.touches[0].clientX - panX;
                  startY = e.touches[0].clientY - panY;
                } else if (e.touches.length === 2) {
                  isPanning = false;
                  initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                  );
                  initialPinchScale = scale;
                }
              }, { passive: false });

              container.addEventListener('touchmove', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.touches.length === 1 && isPanning) {
                  e.preventDefault();
                  hasMoved = true;
                  panX = e.touches[0].clientX - startX;
                  panY = e.touches[0].clientY - startY;
                  applyTransform(false);
                } else if (e.touches.length === 2 && initialPinchDist > 0) {
                  e.preventDefault();
                  var currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                  );
                  scale = Math.min(Math.max(initialPinchScale * (currentDist / initialPinchDist), 0.35), 6.0);
                  applyTransform(false);
                }
              }, { passive: false });

              container.addEventListener('touchend', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.touches.length === 0) {
                  isPanning = false;
                  initialPinchDist = 0;
                }
              });

              document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && container.classList.contains('mermaid-fullscreen')) {
                  closeFullscreen();
                }
              });
            }

            function attachPanZoomToAll() {
              document.querySelectorAll('.mermaid').forEach(function(el) {
                initMermaidPanZoom(el);
              });
            }

            try {
              var p = mermaid.run();
              if (p && typeof p.then === 'function') {
                p.then(attachPanZoomToAll);
              } else {
                setTimeout(attachPanZoomToAll, 250);
              }
            } catch(e) {
              setTimeout(attachPanZoomToAll, 250);
            }
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
