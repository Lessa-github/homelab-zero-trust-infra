<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zero-Trust Homelab | High-Density Infrastructure</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Technical engineering documentation of Gabriel Lessa's Proxmox VE Zero-Trust Infrastructure.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-color: #06b6d4;
      --text-color-base: #e2e8f0;
      --bg-color: #0b0f19;
      --sidebar-bg: #070a12;
      --sidebar-text: #94a3b8;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background-color: #0b0f19 !important;
      color: #e2e8f0 !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }
    .sidebar {
      background-color: #060911 !important;
      border-right: 1px solid #1e293b !important;
      width: 290px !important;
    }
    .sidebar-nav {
      padding: 10px 0 30px 15px !important;
    }
    .sidebar-nav a {
      color: #94a3b8 !important;
      font-size: 0.92rem !important;
      transition: all 0.2s ease !important;
      border-left: 2px solid transparent !important;
      padding-left: 8px !important;
      display: inline-block !important;
    }
    .sidebar-nav a:hover {
      color: #38bdf8 !important;
      border-left-color: #38bdf8 !important;
      padding-left: 12px !important;
    }
    .sidebar-nav li.active > a {
      color: #00f0ff !important;
      font-weight: 600 !important;
      border-left-color: #00f0ff !important;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3) !important;
    }
    .app-name-link {
      font-weight: 700;
      color: #38bdf8 !important;
      font-size: 1.1rem;
    }
    .content {
      padding-top: 15px !important;
    }
    .markdown-section {
      max-width: 980px !important;
      padding: 30px 45px 60px 45px !important;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace !important;
    }
    pre {
      background-color: #070a13 !important;
      border: 1px solid #1e293b !important;
      border-left: 3px solid #00f0ff !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
    }
    .markdown-section blockquote {
      border-left: 4px solid #06b6d4;
      background: rgba(6, 182, 212, 0.05);
      color: #cbd5e1;
      border-radius: 0 8px 8px 0;
      padding: 12px 20px;
    }
    .markdown-section h1 { 
      color: #38bdf8; 
      letter-spacing: -0.02em !important;
      border-bottom: 2px solid #1e293b !important;
      padding-bottom: 12px !important;
    }
    .markdown-section h2 { 
      color: #00f0ff; 
      border-bottom: 1px solid #1e293b; 
      padding-bottom: 8px; 
      margin-top: 3rem;
    }
    .markdown-section h3 { color: #10b981; margin-top: 2rem; }
    
    /* High-Contrast Dark Hacker Table */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 24px 0 !important;
      background-color: #090d16 !important;
      border: 1px solid #1e293b !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }
    .markdown-section table tr {
      background-color: #0b0f19 !important;
      border-top: 1px solid #1e293b !important;
      border-bottom: 1px solid #1e293b !important;
      transition: background-color 0.15s ease !important;
    }
    .markdown-section table tr:nth-child(2n) {
      background-color: #111827 !important;
    }
    .markdown-section table tr:hover {
      background-color: #1e293b !important;
    }
    .markdown-section table th {
      background-color: #0f172a !important;
      color: #38bdf8 !important;
      font-weight: 700 !important;
      font-size: 0.88rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      border: 1px solid #334155 !important;
      padding: 12px 16px !important;
      text-align: left !important;
    }
    .markdown-section table td {
      color: #f1f5f9 !important;
      border: 1px solid #1e293b !important;
      padding: 11px 16px !important;
      font-size: 0.92rem !important;
    }
    .markdown-section table td code {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-size: 0.85rem !important;
    }

    /* Centered Mermaid Diagrams & Dark Hacker Container */
    .mermaid {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      margin: 2.5rem auto !important;
      padding: 1.5rem !important;
      background-color: #070a13 !important;
      border: 1px solid #1e293b !important;
      border-radius: 10px !important;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5) !important;
      overflow-x: auto !important;
      text-align: center !important;
    }
    .mermaid svg {
      max-width: 100% !important;
      height: auto !important;
      margin: 0 auto !important;
      display: block !important;
    }
  </style>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#070a13',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#38bdf8',
        secondaryColor: '#0f172a',
        tertiaryColor: '#111827',
        fontFamily: 'Inter, sans-serif'
      }
    });
  </script>
</head>
<body>
  <div id="app">Loading technical documentation...</div>
  <script>
    window.$docsify = {
      name: '🏛️ Zero-Trust Homelab',
      repo: 'https://github.com/Lessa-github/homelab-zero-trust-infra',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search topics & architectures...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return ('<div class="mermaid">' + code + "</div>");
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            mermaid.run();
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
