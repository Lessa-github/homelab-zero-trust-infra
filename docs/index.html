    /* High-Contrast Responsive Dark Hacker Table */

    /* Hide Mermaid's injected root tooltip to prevent invisible layout bloating / infinite bottom void */
    .mermaidTooltip {
      position: fixed !important;
      top: -9999px !important;
      left: -9999px !important;
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
      overflow: hidden !important;
    }

    /* Mermaid Diagram Sizing & Centering: Crisp, Responsive & Expandable */
    .mermaid {
      position: relative !important;
      text-align: center !important;
      margin: 2.2rem auto !important;
      overflow-x: auto !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      cursor: zoom-in !important;
      border-radius: 8px !important;
      padding: 14px 10px !important;
      background: rgba(13, 19, 34, 0.5) !important;
      border: 1px solid rgba(30, 41, 59, 0.6) !important;
      transition: all 0.2s ease !important;
    }
    .mermaid:hover {

      backdrop-filter: blur(4px);

    .mermaid:hover .mermaid-zoom-badge {

      background: #1e293b;
      border-color: #38bdf8;
    }
    .mermaid.mermaid-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      background: rgba(5, 8, 16, 0.96) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      z-index: 999999 !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      overflow: hidden !important;
      user-select: none !important;
      cursor: grab !important;
    }
    .mermaid.mermaid-fullscreen.is-dragging {

    }
    .mermaid.mermaid-fullscreen svg {
      max-width: 90vw !important;

      width: auto !important;
      height: auto !important;

    .mermaid.mermaid-fullscreen .mermaid-zoom-badge {

    }

    /* Mermaid Box & Label Layout Protection */
    .mermaid svg .edgeLabel {

  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      flowchart: {
        htmlLabels: true,
        padding: 20,
        nodeSpacing: 50,
        rankSpacing: 50,
        wrappingWidth: 260
      },
      themeVariables: {
        darkMode: true,
        background: '#070a13',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#38bdf8',
        secondaryColor: '#0f172a',
        tertiaryColor: '#111827',
        textColor: '#f8fafc',
        mainBkg: '#0d1322',
        nodeBorder: '#38bdf8',
        clusterBkg: '#090e1a',
        clusterBorder: '#1e293b',
        defaultLinkColor: '#38bdf8',
        titleColor: '#00f0ff',
        edgeLabelBackground: '#0b0f19',
        actorTextColor: '#f8fafc',
        actorBkg: '#1e293b',
        actorBorder: '#38bdf8',
        signalColor: '#f8fafc',
        signalTextColor: '#f8fafc',
        labelTextColor: '#f8fafc',
        fontSize: '13px',
        fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, sans-serif'
      }
    });
  </script>
  <script>
    (function() {
      function syncResponsiveState() {
        if (window.innerWidth <= 768) {
          if (document.body && !document.body.dataset.userToggled) {
            document.body.classList.remove('close');
          }
        }
      }
      window.addEventListener('DOMContentLoaded', syncResponsiveState);
      window.addEventListener('resize', syncResponsiveState);
      window.addEventListener('orientationchange', function() {
        setTimeout(syncResponsiveState, 150);
      });
    })();
  </script>
</head>
<body>
  <div id="app">Loading technical documentation...</div>
  <script>
    window.$docsify = {
      name: '🏛️ Zero-Trust Homelab',
      repo: 'https://github.com/Lessa-github/homelab-zero-trust-infra',
      requestHeaders: {
        'cache-control': 'max-age=0, no-cache'
      },
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 0,
      search: {
        placeholder: 'Search topics & architectures...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return ('<div class="mermaid">' + code + "</div>");
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // Wrap tables in responsive container for clean mobile swipe experience
            document.querySelectorAll('.markdown-section table').forEach(function(tbl) {
              if (tbl.parentNode && !tbl.parentNode.classList.contains('table-responsive-container')) {
                var wrap = document.createElement('div');
                wrap.className = 'table-responsive-container';
                tbl.parentNode.insertBefore(wrap, tbl);
                wrap.appendChild(tbl);
              }
            });

            function initMermaidPanZoom(container) {
              if (container.dataset.panzoomBound) return;
              container.dataset.panzoomBound = 'true';

              var svg = container.querySelector('svg');
              if (!svg) return;

              var badge = document.createElement('span');
              badge.className = 'mermaid-zoom-badge';
              badge.innerHTML = '🔍 Click to expand ⛶';
              container.appendChild(badge);

              var scale = 1;
              var panX = 0;
              var panY = 0;
              var isPanning = false;
              var startX = 0;
              var startY = 0;
              var hasMoved = false;
              var dock = null;

              function applyTransform(withTransition) {
                svg.style.transition = withTransition ? 'transform 0.2s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
                svg.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
                if (dock) {
                  var scaleBtn = dock.querySelector('.btn-scale');
                  if (scaleBtn) scaleBtn.textContent = Math.round(scale * 100) + '%';
                }
              }

              function closeFullscreen() {
                container.classList.remove('mermaid-fullscreen');
                container.classList.remove('is-dragging');
                document.body.style.overflow = '';
                scale = 1;
                panX = 0;
                panY = 0;
                svg.style.transform = '';
                svg.style.transition = '';
                if (dock) {
                  dock.remove();
                  dock = null;
                }
              }

              function openFullscreen() {
                container.classList.add('mermaid-fullscreen');
                document.body.style.overflow = 'hidden';
                scale = 1;
                panX = 0;
                panY = 0;
                applyTransform(false);

                if (!dock) {
                  dock = document.createElement('div');
                  dock.className = 'mermaid-dock';
                  dock.innerHTML = [
                    '<button class="btn-zoom-in" title="Zoom In (+)">➕</button>',
                    '<button class="btn-scale" title="Reset Zoom (100%)">100%</button>',
                    '<button class="btn-zoom-out" title="Zoom Out (-)">➖</button>',
                    '<div class="dock-divider"></div>',
                    '<button class="btn-close" title="Close (Esc)">✕ Close</button>'
                  ].join('');
                  container.appendChild(dock);

                  dock.querySelector('.btn-zoom-in').addEventListener('click', function(e) {
                    e.stopPropagation();
                    scale = Math.min(scale * 1.25, 5.0);
                    applyTransform(true);
                  });

                  dock.querySelector('.btn-zoom-out').addEventListener('click', function(e) {
                    e.stopPropagation();
                    scale = Math.max(scale / 1.25, 0.35);
                    applyTransform(true);
                  });

                  dock.querySelector('.btn-scale').addEventListener('click', function(e) {
                    e.stopPropagation();
                    scale = 1;
                    panX = 0;
                    panY = 0;
                    applyTransform(true);
                  });

                  dock.querySelector('.btn-close').addEventListener('click', function(e) {
                    e.stopPropagation();
                    closeFullscreen();
                  });
                }
              }

              container.addEventListener('click', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) {
                  openFullscreen();
                }
              });

              container.addEventListener('wheel', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                e.preventDefault();
                var cx = window.innerWidth / 2;
                var cy = window.innerHeight / 2;
                var mouseX = e.clientX;
                var mouseY = e.clientY;

                var svgCenterX = cx + panX;
                var svgCenterY = cy + panY;
                var relX = (mouseX - svgCenterX) / scale;
                var relY = (mouseY - svgCenterY) / scale;

                var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                var newScale = Math.min(Math.max(scale * factor, 0.35), 6.0);

                panX = mouseX - cx - relX * newScale;
                panY = mouseY - cy - relY * newScale;
                scale = newScale;

                applyTransform(false);
              }, { passive: false });

              container.addEventListener('mousedown', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.target.closest('.mermaid-dock')) return;
                if (e.button === 0) {
                  isPanning = true;
                  hasMoved = false;
                  startX = e.clientX - panX;
                  startY = e.clientY - panY;
                  container.classList.add('is-dragging');
                }
              });

              window.addEventListener('mousemove', function(e) {
                if (!isPanning || !container.classList.contains('mermaid-fullscreen')) return;
                var dx = Math.abs(e.clientX - (startX + panX));
                var dy = Math.abs(e.clientY - (startY + panY));
                if (dx > 4 || dy > 4) hasMoved = true;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                applyTransform(false);
              });

              window.addEventListener('mouseup', function(e) {
                if (!isPanning || !container.classList.contains('mermaid-fullscreen')) return;
                isPanning = false;
                container.classList.remove('is-dragging');
                if (!hasMoved && (e.target === container || !e.target.closest('svg'))) {
                  closeFullscreen();
                }
              });

              var initialPinchDist = 0;
              var initialPinchScale = 1;

              container.addEventListener('touchstart', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.target.closest('.mermaid-dock')) return;
                if (e.touches.length === 1) {
                  isPanning = true;
                  hasMoved = false;
                  startX = e.touches[0].clientX - panX;
                  startY = e.touches[0].clientY - panY;
                } else if (e.touches.length === 2) {
                  isPanning = false;
                  initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                  );
                  initialPinchScale = scale;
                }
              }, { passive: false });

              container.addEventListener('touchmove', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.touches.length === 1 && isPanning) {
                  e.preventDefault();
                  hasMoved = true;
                  panX = e.touches[0].clientX - startX;
                  panY = e.touches[0].clientY - startY;
                  applyTransform(false);
                } else if (e.touches.length === 2 && initialPinchDist > 0) {
                  e.preventDefault();
                  var currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                  );
                  scale = Math.min(Math.max(initialPinchScale * (currentDist / initialPinchDist), 0.35), 6.0);
                  applyTransform(false);
                }
              }, { passive: false });

              container.addEventListener('touchend', function(e) {
                if (!container.classList.contains('mermaid-fullscreen')) return;
                if (e.touches.length === 0) {
                  isPanning = false;
                  initialPinchDist = 0;
                }
              });

              document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && container.classList.contains('mermaid-fullscreen')) {
                  closeFullscreen();
                }
              });
            }

            function attachPanZoomToAll() {
              document.querySelectorAll('.mermaid').forEach(function(el) {
                initMermaidPanZoom(el);
              });
            }

            try {
              var p = mermaid.run();
              if (p && typeof p.then === 'function') {
                p.then(attachPanZoomToAll);
              } else {
                setTimeout(attachPanZoomToAll, 250);
              }
            } catch(e) {
              setTimeout(attachPanZoomToAll, 250);
            }
          });
          hook.ready(function() {
            var toggleBtn = document.querySelector('.sidebar-toggle');
            if (toggleBtn) {
              toggleBtn.addEventListener('click', function() {
                document.body.dataset.userToggled = 'true';
              });
            }
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
