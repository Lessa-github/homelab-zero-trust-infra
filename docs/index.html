<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Homelab Zero-Trust | Arquitetura & Infraestrutura</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentação técnica de engenharia da infraestrutura Proxmox VE Zero-Trust de Gabriel Lessa.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-color: #06b6d4;
      --text-color-base: #e2e8f0;
      --bg-color: #0b0f19;
      --sidebar-bg: #070a12;
      --sidebar-text: #94a3b8;
    }
    body {
      background-color: #0b0f19 !important;
      color: #e2e8f0 !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }
    .sidebar {
      background-color: #070a12 !important;
      border-right: 1px solid #1e293b !important;
    }
    .sidebar-nav a {
      color: #94a3b8 !important;
      font-size: 0.95rem;
    }
    .sidebar-nav li.active > a {
      color: #06b6d4 !important;
      font-weight: 600;
    }
    .app-name-link {
      font-weight: 700;
      color: #38bdf8 !important;
      font-size: 1.1rem;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace !important;
    }
    pre {
      background-color: #0f172a !important;
      border: 1px solid #1e293b !important;
      border-radius: 8px !important;
    }
    .markdown-section blockquote {
      border-left: 4px solid #06b6d4;
      background: rgba(6, 182, 212, 0.05);
      color: #cbd5e1;
      border-radius: 0 8px 8px 0;
      padding: 12px 20px;
    }
    .markdown-section h1 { color: #38bdf8; }
    .markdown-section h2 { color: #06b6d4; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
    .markdown-section h3 { color: #10b981; }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }
    .markdown-section th {
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 10px;
    }
    .markdown-section td {
      border: 1px solid #1e293b;
      padding: 10px;
    }
  </style>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  </script>
</head>
<body>
  <div id="app">Carregando documentação técnica...</div>
  <script>
    window.$docsify = {
      name: '🏛️ Homelab Zero-Trust',
      repo: 'https://github.com/Lessa-github/homelab-zero-trust-infra',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Pesquisar tópicos...',
        noData: 'Nenhum resultado encontrado',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Erro',
        successText: 'Copiado!'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return ('<div class="mermaid">' + code + "</div>");
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            mermaid.run();
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
